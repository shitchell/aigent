[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aigent"
version = "0.2.0"
description = "A robust, local-first, event-driven AI Pair Programmer."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "User", email = "user@example.com"}
]
dependencies = [
    "langchain>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "aiofiles>=23.2.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
    "websockets>=12.0",
    "textual>=0.70.0",
    "strenum>=0.4.15", # For StrEnum support across versions if needed, though 3.11 has it built-in. Adding for safety/compatibility.
    "dill>=0.3.8"      # For robust pickling
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-timeout>=2.2.0",
    "playwright>=1.40.0",
    "pexpect>=4.9.0",
    "mypy>=1.10.0",
    "pydocstyle>=6.3.0",
    "pylint>=3.2.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "types-aiofiles",
    "types-PyYAML",
    "types-setuptools"
]

[project.scripts]
aigent = "aigent.main:entry_point"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout = 30
markers = [
    "e2e: End-to-end tests requiring external services",
    "asyncio: Asyncio tests"
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
ignore_missing_imports = false
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "langchain.*",
    "langchain_core.*",
    "langchain_openai.*",
    "langchain_anthropic.*",
    "fastapi.*",
    "uvicorn.*",
    "dill.*",
    "textual.*"
]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pydocstyle]
convention = "google"
match-dir = "^(?!test).*"
match = ".*\\.py"

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
